version: "3.8"

services:
  waha:
    image: devlikeapro/waha-plus:chrome
    container_name: waha
    ports:
      - '3000:3000'
    volumes:
      - './.sessions:/app/.sessions'
    env_file:
      - .env
    restart: always

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data: {}
