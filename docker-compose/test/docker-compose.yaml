services:
  waha:
    image: devlikeapro/waha-plus:chrome
    container_name: waha
    restart: always
    ports:
      - '3000:3000' # expõe a porta para o dashboard e API
    volumes:
      - './.sessions:/app/.sessions'
    env_file:
      - .env
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WHATSAPP_SESSIONS_MONGO_URL=mongodb://mongodb:27017
      - WAHA_BASE_URL=https://waha-production-xxxxx.up.railway.app # ajuste isso com sua URL do Railway
      - WHATSAPP_HOOK_URL=https://n8n-production-yyyyy.up.railway.app/webhook/entrada # troque pelo link correto do n8n
      - WHATSAPP_HOOK_EVENTS=message

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: {}
